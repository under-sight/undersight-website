name: Deploy Production (Fibery → undersight.ai)

on:
  schedule:
    # Every 2 hours at :07. Was '* * * * *' (every minute) — GitHub's scheduler
    # throttling silently reduced that to ~2h anyway; this makes the cadence
    # explicit and keeps Cloudflare Pages deploys (~12/day) safely under the
    # 500/month quota. Use workflow_dispatch for an immediate publish.
    - cron: "7 */2 * * *"  # authored by kyle-undersight: scheduled-failure emails route to the cron author
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Schema guard (block stale Fibery refs)
        run: |
          echo "Checking for old schema references..."
          if grep -rn 'CMS/Whitepapers\|CMS/Whitepaper Leads\|CMS/Whitepaper[^s]' \
            functions/ undersight-serve.py worker/index.js index.html; then
            echo "::error::Old Fibery schema names detected. Correct schema is CMS/Blog, CMS/Website Leads, CMS/Blog Post."
            exit 1
          fi
          echo "Schema check passed."

      - name: Schema guard (block 'Blog -*' regressions in CMS/Pages)
        env:
          FIBERY_TOKEN: ${{ secrets.FIBERY_TOKEN }}
        run: |
          echo "Querying CMS/Pages for stale 'Blog -*' entities..."
          python3 - <<'PY'
          import json, os, sys, urllib.request
          token = os.environ.get("FIBERY_TOKEN", "")
          if not token:
              print("::warning::FIBERY_TOKEN not set, skipping Pages 'Blog -*' guard")
              sys.exit(0)
          req = urllib.request.Request(
              "https://subscript.fibery.io/api/commands",
              data=json.dumps([{
                  "command": "fibery.entity/query",
                  "args": {"query": {
                      "q/from": "CMS/Pages",
                      "q/select": {"name": "CMS/Name"},
                      "q/where": ["q/contains", ["CMS/Name"], "$prefix"],
                      "q/limit": 50,
                  }, "params": {"$prefix": "Blog -"}},
              }]).encode(),
              headers={"Authorization": f"Token {token}",
                       "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read())
          result = data[0].get("result", []) if data else []
          stale = [r["name"] for r in result
                   if isinstance(r, dict) and isinstance(r.get("name"), str)
                   and r["name"].startswith("Blog -")]
          if stale:
              # WARN only (not fail) until user deletes the legacy Blog -* entries
              # in Fibery UI. Cutover commit ca74a80 added code that ignores these
              # entries at build time, so they are dormant — just clutter. Once
              # deleted, this guard can be promoted back to a hard fail by
              # changing the next line to sys.exit(1).
              print("::warning::Stale 'Blog -*' entities detected in CMS/Pages — content lives in CMS/Blog now; delete these via Fibery UI to enable strict mode:")
              for n in stale:
                  print(f"  - {n}")
          else:
              print("Pages 'Blog -*' guard passed (no regressions).")
          PY

      # Fail closed (2026-07-30 and 2026-08-19 outages): if the build or
      # validation fails, the RUN fails, no deploy happens, and the previous
      # deploy stays live. There is deliberately NO fallback-to-placeholder
      # step here — the only way to ship under-construction.html is the Site
      # Mode switch in Fibery Site Config, which build.py honors and
      # build-validation.sh recognizes via dist/.build-meta.json. The failed
      # run emails the cron author; health-check.yml is the backup channel.
      - name: Build site from Fibery (respects Site Mode)
        id: build
        env:
          FIBERY_TOKEN: ${{ secrets.FIBERY_TOKEN }}
        run: python3 build.py --verify --env production

      - name: Validate build output
        id: validate
        run: bash tests/build-validation.sh

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name undersight-website --branch main --commit-dirty=true

      # The two Fibery steps below are telemetry/advisory: a flake here must
      # not fail a run whose deploy succeeded (that noise is what emailed Kyle
      # on 2026-08-05). Site-down alerting lives in health-check.yml instead.
      - name: Report deployment to Fibery
        continue-on-error: true
        env:
          FIBERY_TOKEN: ${{ secrets.FIBERY_TOKEN }}
          # Fail-closed workflow: this step is only reached when build,
          # validate, and deploy all succeeded.
          BUILD_STATUS: success
        run: python3 deploy-report.py --env production --url "https://undersight.ai" --status "$BUILD_STATUS"

      - name: Verify deployment matches Fibery intent
        continue-on-error: true
        env:
          FIBERY_TOKEN: ${{ secrets.FIBERY_TOKEN }}
        run: python3 deploy-report.py --verify --env production
