name: Sync dev from main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # dev is a MIRROR of main (since 2026-08-05): the old merge-based sync
      # failed with conflicts on every push once the branches diverged,
      # emailing a failure per commit. Dev-only work goes through PRs to
      # main, never direct commits to dev — a mirror push cannot conflict,
      # so this workflow cannot fail-and-email. Dev-only utilities were
      # salvaged onto main before the first mirror reset.
      - name: Mirror main to dev
        run: git push origin main:dev --force
