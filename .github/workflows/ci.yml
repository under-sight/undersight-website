name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/build-from-repo.test.py
      - run: python3 tests/md-pages.test.py
      - run: bash tests/build-validation.sh
      - run: node --test tests/*.test.mjs
